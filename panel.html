<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Zero // Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #060102; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; padding-bottom: 100px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #180206 0%, #080102 100%); border: 1px solid #7f1d1d; padding: 18px 24px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 30px rgba(127, 29, 29, 0.3); gap: 12px; flex-wrap: wrap; }
        .header-title-box { display: flex; flex-direction: column; gap: 3px; }
        .header h1 { font-size: 1.2rem; color: #f87171; letter-spacing: 2px; font-weight: 800; line-height: 1.1; }
        .sub-title { font-size: 0.75rem; color: #fca5a5; opacity: 0.8; letter-spacing: 0.5px; font-weight: 500; }
        
        .status-pill { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; background: #1f060b; padding: 6px 14px; border-radius: 20px; border: 1px solid #991b1b; white-space: nowrap; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }

        /* Metrik Gridleri */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .metric-card { background: #100204; border: 1px solid #7f1d1d44; padding: 18px; border-radius: 14px; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .metric-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #dc2626; }
        .metric-card label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #fca5a5; font-weight: 600; display: block; margin-bottom: 8px; }
        .metric-card .value { font-size: 1.4rem; font-weight: bold; color: #f8fafc; font-family: monospace; }
        
        /* Progress Bar (CPU, RAM için) */
        .progress-bar-bg { width: 100%; background: #1f060b; height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; border: 1px solid #7f1d1d55; }
        .progress-bar-fill { height: 100%; background: #ef4444; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 8px #ef4444; }

        /* Sürekli sağa akışlı gradient yazı */
        .metric-card .gradient-text { 
            font-size: 1.15rem; 
            font-weight: 800; 
            margin-top: 4px; 
            font-family: monospace; 
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fca5a5, #ef4444, #ffffff, #ef4444, #fca5a5);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientScroll 4s linear infinite;
        }

        @keyframes gradientScroll {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        /* Hosting Bölümü */
        .hosting-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 800px) { .hosting-section { grid-template-columns: 1fr; } }

        .panel-box { background: #100204; border: 1px solid #7f1d1d44; border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .panel-title { font-size: 0.9rem; font-weight: 600; color: #fca5a5; margin-bottom: 15px; border-bottom: 1px solid #7f1d1d44; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; }
        .hosting-btn { background: #180206; border: 1px solid #7f1d1d; color: #f87171; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .hosting-btn:hover { background: #7f1d1d; color: #fff; transform: translateY(-1px); }
        .hosting-btn.danger { border-color: #991b1b; color: #ef4444; }
        .hosting-btn.danger:hover { background: #991b1b; color: #fff; }

        /* Konsol Log Ekranı */
        .log-console { background: #040001; border: 1px solid #7f1d1d66; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.75rem; color: #cbd5e1; height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

        .footer { 
            margin-top: auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 0.75rem; 
            color: #94a3b8; 
            border-top: 1px solid #7f1d1d33; 
            padding-top: 20px; 
            gap: 12px;
            text-align: center;
        }
        .footer span { color: #f87171; font-weight: bold; font-family: monospace; }

        /* Yüzen Müzik Barı */
        .music-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; 
            background: rgba(16, 2, 4, 0.95); backdrop-filter: blur(10px); border: 1px solid #7f1d1d; padding: 12px 20px; 
            border-radius: 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; transition: all 0.3s ease; 
        }
        .music-bar.minimized { transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none; }
        .floating-open-btn {
            position: fixed; bottom: 20px; right: 20px; background: #180206; border: 1px solid #7f1d1d; color: #f87171; 
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .floating-open-btn.visible { opacity: 1; pointer-events: auto; }
        .music-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .music-icon { color: #f87171; display: flex; align-items: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .music-title { font-size: 0.85rem; color: #f87171; font-weight: bold; font-family: monospace; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 320px; }
        .music-controls { display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: #7f1d1d; color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: #b91c1c; transform: scale(1.05); }
        .icon-btn-outline { background: transparent; border: 1px solid #7f1d1d; color: #fca5a5; }
        .icon-btn-outline:hover { background: #4a0e17; color: #fff; }
        #youtube-player-container { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title-box">
            <h1>SZSERVER</h1>
            <div class="sub-title">Sunucu İzleme Sistemi</div>
        </div>
        <div class="status-pill">
            <span id="dot" class="dot"></span>
            <span id="statusText">Bağlanılıyor</span>
        </div>
    </div>

    <!-- Metrik Kartları -->
    <div class="dashboard-grid">
        <div class="metric-card">
            <label>CPU Kullanımı</label>
            <div id="cpuVal" class="value" style="color: #f87171;">--%</div>
            <div class="progress-bar-bg"><div id="cpuBar" class="progress-bar-fill"></div></div>
        </div>
        <div class="metric-card">
            <label>Bellek (RAM)</label>
            <div id="ramVal" class="value" style="color: #fca5a5;">--%</div>
            <div class="progress-bar-bg"><div id="ramBar" class="progress-bar-fill" style="background:#fca5a5; box-shadow:0 0 8px #fca5a5;"></div></div>
        </div>
        <div class="metric-card">
            <label>Disk Alanı (SSD)</label>
            <div id="diskVal" class="value" style="color: #60a5fa;">-- GB</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 35%; background:#60a5fa; box-shadow:0 0 8px #60a5fa;"></div></div>
        </div>
        <div class="metric-card" style="border-left-color: #ef4444;">
            <label>Gecikme</label>
            <div id="pingValue" class="value" style="color: #22c55e;">-- ms</div>
        </div>
        <div class="metric-card" style="border-left-color: #b91c1c;">
            <label>Sistem Yetkilisi</label>
            <div class="gradient-text">Owned by EmossDev</div>
        </div>
    </div>

    <!-- Hızlı İşlemler ve Konsol -->
    <div class="hosting-section">
        <div class="panel-box">
            <div class="panel-title">Sunucu Hızlı İşlemleri</div>
            <div class="action-buttons">
                <button class="hosting-btn" onclick="sendCmd('restart')">
                    <span>Sunucuyu Yeniden Başlat (Restart)</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <button class="hosting-btn" onclick="sendCmd('flush')">
                    <span>Sunucu Önbelleğini Temizle (Flush)</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <button class="hosting-btn danger" onclick="sendCmd('maintenance')">
                    <span>Bakım Modunu Aç / Kapat</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </button>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">Canlı Sunucu Konsolu (Logs)</div>
            <div id="logConsole" class="log-console">
                <div>[SYSTEM] Konsol akışı bekleniyor...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>Sector Zero Core</div>
        <span style="color: #7f1d1d;">&bull;</span>
        <div>Made by <span>EmossDev</span></div>
    </div>

    <!-- Müzik Barı -->
    <div id="musicBar" class="music-bar">
        <div class="music-left">
            <div class="music-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <span id="trackTitle" class="music-title">NCS Arşivi Yükleniyor...</span>
        </div>
        <div class="music-controls">
            <button class="icon-btn" onclick="nextTrack()" title="Sonraki Parça">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
            <button class="icon-btn icon-btn-outline" onclick="toggleMusicBar()" title="Gizle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="floatingOpenBtn" class="floating-open-btn" onclick="toggleMusicBar()" title="Müziği Aç">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </div>

    <div id="youtube-player-container"><div id="yt-player"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let ws = null;
        let player;
        let isBarMinimized = false;

        const ncsPlaylist = [
            { id: "J2X5mJ3HDYE", name: "DEAF KEV - Invincible" },
            { id: "K4DyBUG242c", name: "Cartoon - On & On" },
            { id: "CSvFpBOe8eY", name: "Alan Walker - Spectre" },
            { id: "B7xai5u_tnk", name: "Elektronomia - Sky High" },
            { id: "m2rjovJ2dEg", name: "Janji - Heroes Tonight" },
            { id: "n8wpw5U5m5k", name: "Tobu - Candyland" },
            { id: "TN_CDb-H4IE", name: "Different Heaven & EH!DE - My Heart" },
            { id: "iFpfCpUsJQg", name: "Warriyo - Mortals" },
            { id: "lYoUKvY2ZSk", name: "Tobu - Infectious" },
            { id: "jK2aIUmmdP4", name: "RetroVision - Campfire" },
            { id: "7wNb0pHyGuI", name: "Lost Sky - Vision" },
            { id: "P7ZsBPK656s", name: "Ahrix - Nova" },
            { id: "2_LxWq84WqU", name: "Alan Walker - Fade" },
            { id: "RBWmMDnHnMY", name: "Syn Cole - Feel Good" },
            { id: "8ZXEGtrtEoU", name: "RetroVision - Puzzle" },
            { id: "f2KcdmlUnfo", name: "Jone - Tomorrow" },
            { id: "98JeyJAjfbo", name: "Jim Yosef - Eclipse" },
            { id: "CuklIb9d3fI", name: "Disfigure - Blank" },
            { id: "wWwL_U73kSw", name: "Subtact - Away" },
            { id: "YwYdM_Y-W_0", name: "Itro & Tobu - Cloud 9" },
            { id: "K89Zc6k1uY0", name: "Jo Cohen & Sex Whales - We Are" },
            { id: "U4wV_Y03L2Y", name: "Axol - Mars" },
            { id: "3jK5h1l2X8A", name: "Distrion & Alex Skrindo - Entropy" },
            { id: "v1pbbrXNdso", name: "NCS: The Best of Electronic" },
            { id: "7h1W-q-2h1c", name: "Janji - Horizon" },
            { id: "p1o2i3u4y5t", name: "Culture Code - Make Me Move" },
            { id: "q1w2e3r4t5y", name: "K-391 - Earth" },
            { id: "z1x2c3v4b5n", name: "Laszlo - Here We Are" },
            { id: "m1n2b3v4c5x", name: "Tobu - Hope" },
            { id: "a1s2d3f4g5h", name: "Electro-Light - Symbolism" },
            { id: "qAZwsxEDCrf", name: "Phantom - Lights" },
            { id: "tGBYhnUJMik", name: "TULE - Lost" },
            { id: "1234567890q", name: "Diviners - Savannah" },
            { id: "abcdefghijk", name: "Jone - Without You" },
            { id: "lmnopqrsTUV", name: "K-391 & Alan Walker - Ignite" },
            { id: "zyxwvutsrqp", name: "NCS Megamix" },
            { id: "mnbvcxzlkjh", name: "Lost Sky - Fearless" },
            { id: "poiuytrewq0", name: "Spektrem - Shine" },
            { id: "asdfghjklpoi", name: "Strahinja - Cyberpunk" },
            { id: "zxcvbnmasdfg", name: "Syn Cole - Gizmo" },
            { id: "qazwsxedcrfv", name: "Tobu - Sound of Goodbye" },
            { id: "tgbyhnujmikop", name: "Venemy - Resistance" },
            { id: "plmkoijnbuhv", name: "Itro - Panda" },
            { id: "wsxedcrfvtgb", name: "Jim Yosef - Firefly" },
            { id: "edcrfvtgbyhn", name: "Lost Sky - Dreams" },
            { id: "rfvtgbyhnujm", name: "Cartoon - Why We Lose" }
        ];
        let currentTrackIndex = 0;

        function toggleMusicBar() {
            const bar = document.getElementById('musicBar');
            const openBtn = document.getElementById('floatingOpenBtn');
            isBarMinimized = !isBarMinimized;
            if (isBarMinimized) {
                bar.classList.add('minimized');
                openBtn.classList.add('visible');
            } else {
                bar.classList.remove('minimized');
                openBtn.classList.remove('visible');
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                videoId: ncsPlaylist[currentTrackIndex].id,
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 0 },
                events: {
                    'onReady': (e) => {
                        updateTrackInfo();
                        window.addEventListener('click', () => {
                            if (player && player.getPlayerState() !== YT.PlayerState.PLAYING) { player.playVideo(); }
                        }, { once: true });
                    },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) nextTrack(); }
                }
            });
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % ncsPlaylist.length;
            player.loadVideoById(ncsPlaylist[currentTrackIndex].id);
            updateTrackInfo();
        }

        function updateTrackInfo() {
            document.getElementById('trackTitle').textContent = ncsPlaylist[currentTrackIndex].name;
        }

        function sendCmd(actionName) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ t: 'cmd', action: actionName }));
            }
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(proto + location.host);

            ws.onopen = () => {
                document.getElementById('dot').className = "dot online";
                document.getElementById('statusText').textContent = "Aktif";
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.serverPing !== undefined) {
                        const pingVal = data.serverPing;
                        const pingEl = document.getElementById('pingValue');
                        pingEl.textContent = pingVal + ' ms';
                        pingEl.style.color = pingVal <= 5 ? '#22c55e' : (pingVal <= 12 ? '#eab308' : '#ef4444');
                        
                        // Ping değerine göre durum hapını dinamik güncelle
                        const statusTxt = document.getElementById('statusText');
                        const dotEl = document.getElementById('dot');
                        if (pingVal > 15) {
                            statusTxt.textContent = "Kararsız";
                            dotEl.className = "dot";
                            dotEl.style.background = "#eab308";
                            dotEl.style.boxShadow = "0 0 10px #eab308";
                        } else {
                            statusTxt.textContent = "Aktif";
                            dotEl.className = "dot online";
                            dotEl.style.background = "";
                            dotEl.style.boxShadow = "";
                        }
                    }

                    if (data.cpu !== undefined) {
                        document.getElementById('cpuVal').textContent = data.cpu + '%';
                        document.getElementById('cpuBar').style.width = data.cpu + '%';
                    }

                    if (data.ram !== undefined) {
                        document.getElementById('ramVal').textContent = data.ram + '%';
                        document.getElementById('ramBar').style.width = data.ram + '%';
                    }

                    if (data.disk !== undefined) {
                        document.getElementById('diskVal').textContent = data.disk + ' GB';
                    }

                    if (data.logs && Array.isArray(data.logs)) {
                        const consoleDiv = document.getElementById('logConsole');
                        consoleDiv.innerHTML = data.logs.map(l => `<div>${l}</div>`).join('');
                        consoleDiv.scrollTop = consoleDiv.scrollHeight;
                    }
                } catch (e) {}
            };

            ws.onclose = () => {
                document.getElementById('dot').className = "dot";
                document.getElementById('dot.online').style.background = "";
                document.getElementById('statusText').textContent = "Devre Dışı";
                document.getElementById('pingValue').textContent = "-- ms";
                setTimeout(connect, 3000);
            };
        }

        window.onload = connect;
    </script>
</body>
</html>
