<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZServer Core | Multiplayer Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f19; color: #00ffcc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: rgba(16, 23, 42, 0.9); border: 1px solid #00ffcc55; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.15); overflow: hidden; }
        .header { background: #131c31; padding: 15px 20px; border-bottom: 1px solid #00ffcc33; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.1rem; letter-spacing: 2px; color: #fff; }
        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: #ff336633; color: #ff3366; border: 1px solid #ff336655; }
        .status-badge.online { background: #00ffcc22; color: #00ffcc; border-color: #00ffcc55; }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #8892b0; margin-bottom: 6px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; background: #07090e; border: 1px solid #233554; color: #fff; padding: 12px; border-radius: 6px; font-size: 0.95rem; outline: none; transition: 0.3s; }
        input:focus { border-color: #00ffcc; box-shadow: 0 0 8px rgba(0,255,204,0.3); }
        button { background: #00ffcc; color: #0b0f19; border: none; padding: 0 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00cca3; box-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .console { background: #07090e; border: 1px solid #233554; border-radius: 6px; height: 200px; padding: 12px; overflow-y: auto; font-size: 0.85rem; color: #a8b2d1; display: flex; flex-direction: column; gap: 6px; }
        .log-entry { display: flex; gap: 10px; }
        .log-time { color: #4a5568; }
        .log-msg.success { color: #00ffcc; }
        .log-msg.error { color: #ff3366; }
        .log-msg.info { color: #64ffda; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SZSERVER // CORE</h1>
            <div id="statusBadge" class="status-badge">DISCONNECTED</div>
        </div>
        <div class="content">
            <div class="input-group">
                <label for="wsUrl">WebSocket Sunucu Adresi (WSS / WS)</label>
                <div class="input-row">
                    <input type="text" id="wsUrl" value="wss://sz-server-snowy.vercel.app" placeholder="ws://localhost:8080">
                    <button id="connectBtn" onclick="toggleConnection()">BAĞLAN</button>
                </div>
            </div>
            
            <div class="input-group">
                <label>Canlı Konsol Akışı</label>
                <div id="console" class="console">
                    <div class="log-entry"><span class="log-time">[00:00]</span><span class="log-msg info">Sistem başlatıldı. Sunucu bağlantısı bekleniyor...</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const consoleEl = document.getElementById('console');
        const statusBadge = document.getElementById('statusBadge');
        const connectBtn = document.getElementById('connectBtn');
        const wsUrlInput = document.getElementById('wsUrl');

        function log(msg, type = 'info') {
            const time = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-msg ${type}">${msg}</span>`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                return;
            }

            const url = wsUrlInput.value;
            log(`Bağlanılıyor: ${url} ...`, 'info');

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    statusBadge.textContent = "ONLINE";
                    statusBadge.className = "status-badge online";
                    connectBtn.textContent = "AYRIL";
                    log("Bağlantı başarıyla kuruldu!", "success");
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        log(`Paket alındı: ${JSON.stringify(data)}`, 'info');
                    } catch (e) {
                        log(`Ham veri: ${event.data}`, 'info');
                    }
                };

                ws.onclose = () => {
                    statusBadge.textContent = "DISCONNECTED";
                    statusBadge.className = "status-badge";
                    connectBtn.textContent = "BAĞLAN";
                    log("Sunucu bağlantısı kapandı.", "error");
                };

                ws.onerror = (err) => {
                    log("WebSocket bağlantı hatası oluştu! (Vercel doğrudan ws desteklemez, harici sunucu URL'si gerekebilir)", "error");
                };

            } catch (e) {
                log(`Hata: ${e.message}`, "error");
            }
        }
    </script>
</body>
</html>
